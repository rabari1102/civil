/* The panel. Zones 25 / 50 / 25, as in the reference. */
.am-mm__panel{position:fixed;left:0;right:0;top:var(--am-mm-top,112px);background:#fff;
  box-shadow:0 30px 60px -30px rgba(20,24,28,.35);opacity:0;visibility:hidden;text-align:left;
  transition:opacity .3s ease-in-out,visibility 0s linear .3s;z-index:1000}
.am-mm__item.is-open .am-mm__panel{opacity:1;visibility:visible;transition:opacity .4s linear}
.am-mm__panel a{white-space:normal!important;height:auto!important;margin-right:0!important}
.am-mm__inner{display:flex;min-height:320px}
.am-mm__left{flex:0 0 25%;box-sizing:border-box;background:#e00910;color:#fff;padding:18px 3.4vw 3.4vw 4.6vw;
  display:flex;flex-direction:column}
.am-mm__lt{font-size:16px;font-weight:700;line-height:20px;margin:0 0 27px}
.am-mm__left p{font-size:18px;line-height:23.4px;font-weight:300;margin:0 0 24px;color:#fff}
.am-mm__more,.am-mm__rl{display:inline-flex!important;align-items:center;gap:12px;text-transform:uppercase;letter-spacing:.84px;
  font-size:14px;font-weight:500;text-decoration:none;margin-top:auto}
.am-mm__more{color:#fff!important}
.am-mm__more i,.am-mm__rl i{display:inline-block;width:30px;height:1px;background:currentColor;position:relative;transition:width .3s ease}
.am-mm__more i::after,.am-mm__rl i::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;
  border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.am-mm__more:hover i,.am-mm__rl:hover i{width:40px}
.am-mm__center{flex:0 0 50%;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;
  transform:translateY(10px);transition:transform .3s ease-out}
.am-mm__right{flex:0 0 25%;box-sizing:border-box;display:flex;flex-direction:column;padding:18px 36px 30px 12px;
  transform:translateY(10px);transition:transform .3s ease-out}
.am-mm__item.is-open .am-mm__center,.am-mm__item.is-open .am-mm__right{transform:none}
.am-mm__col{padding:18px 24px 24px;min-width:0}
.am-mm__h{display:block!important;font-size:16px;font-weight:700;line-height:20px;color:#17171b!important;text-decoration:none;margin:0 0 25px;min-height:20px}
a.am-mm__h:hover{color:#e00910!important}
.am-mm__col ul{list-style:none;margin:0;padding:0}
.am-mm__col li{margin:0 0 10px;padding:0}
.am-mm__col li::before{display:none}
.am-mm__col li a{display:block!important;color:#17171b!important;font-size:14px;font-weight:400;line-height:18px;
  text-decoration:none;transition:color .3s ease-in-out}
.am-mm__col li a:hover,.am-mm__col li a:focus{color:#e00910!important}
.am-mm__inner--xwide .am-mm__right{display:none!important}.am-mm__inner--xwide .am-mm__center{flex-basis:80%!important}.am-mm__inner--xwide .am-mm__col{padding-right:14px}
.am-mm__inner--wide .am-mm__left{flex-basis:20%}.am-mm__inner--wide .am-mm__right{flex-basis:20%}.am-mm__inner--wide .am-mm__center{flex-basis:60%}
.am-mm__center{grid-template-columns:repeat(var(--c,3),minmax(0,1fr))!important}
.am-mm__center--toggle{display:block!important}
.am-mm__view{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr))}
.am-mm__center--toggle[data-view="p"] .am-mm__view[data-v="s"],.am-mm__center--toggle[data-view="s"] .am-mm__view[data-v="p"]{display:none}
.am-mm__tg{display:flex;align-items:center;gap:6px;padding:14px 24px 0}
.am-mm__tg span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b8e94;margin-right:6px}
.am-mm__tg button{all:unset;cursor:pointer;font-size:13px;font-weight:500;padding:6px 14px;border-radius:100px;border:1px solid #e2e2e4;color:#17171b}

.am-mm__col li{margin:0 0 7px}

.am-mm__pane{display:none;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start}

.am-mm__center--rail .am-mm__tg{padding:14px 12px 0 24px}
